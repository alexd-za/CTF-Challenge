name: ChatGPT Tuimeltrein APK Build

on:
  push:
    branches:
      - chatgpt-tuimeltrein-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tuimeltrein"
          cat .chatgpt-build/part* | base64 --decode > "$RUNNER_TEMP/tuimeltrein.zip"
          unzip -q "$RUNNER_TEMP/tuimeltrein.zip" -d "$RUNNER_TEMP/tuimeltrein"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        working-directory: ${{ runner.temp }}/tuimeltrein
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/tuimeltrein
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="${RUNNER_TEMP}/tuimeltrein/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tuimeltrein-Exam-Mastery-v2.3.0-debug
          path: ${{ runner.temp }}/tuimeltrein/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
