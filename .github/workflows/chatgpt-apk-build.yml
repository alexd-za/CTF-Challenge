name: ChatGPT APK Build

on:
  push:
    branches:
      - chatgpt-apk-build-20260909

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reassemble and verify uploaded project
        run: |
          cat chatgpt-apk-build/part-* > tuimeltrein-project.zip
          echo "1eb471a996bcad9185750bd2c47b51e770530ab2115069269d1d6c1fdf157958  tuimeltrein-project.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q tuimeltrein-project.zip -d ci-project

      - name: Build debug APK
        working-directory: ci-project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuimeltrein-v2.3.0-debug-apk
          path: ci-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
